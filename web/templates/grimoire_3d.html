<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Priory Grimoire 3D — WebGL Workbench</title>
  <link rel="stylesheet" href="/static/css/grimoire_3d.css">
</head>
<body class="grimoire-3d-body">
  <div class="wb3d-shell" id="hud-layer">
    <!-- Top Control Toolbar (34px) -->
    <header class="hud-top-bar">
      <div class="hud-brand">
        <span class="priory-sigil priory-sigil--gdc" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.4L10.6 6L6 10.6L1.4 6Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><circle cx="6" cy="6" r="1.4" fill="currentColor"/></svg>
        </span>
        <h1 class="hud-brand-title">The Priory Grimoire</h1>
        <span class="hud-brand-sep" aria-hidden="true"></span>
        <span class="hud-brand-badge">WebGL 3D Workbench</span>
      </div>

      <div class="hud-top-actions">
        <div class="camera-mode-group" role="group" aria-label="Camera Presets">
          <button class="cam-btn active" data-mode="reading" id="cam-reading" type="button" title="Reading Perspective">Reading</button>
          <button class="cam-btn" data-mode="inspect" id="cam-inspect" type="button" title="Close Page Inspection">Inspect</button>
          <button class="cam-btn" data-mode="astrolabe" id="cam-astrolabe" type="button" title="Scrying Matrix Focus">Scrying</button>
          <button class="cam-btn" data-mode="orbit" id="cam-orbit" type="button" title="Free 3D Camera Orbit">Free Orbit</button>
        </div>

        <a href="/" class="wb-btn" title="Return to Classic Workbench View">Classic View</a>
        <button class="wb-btn" id="audio-toggle-3d" type="button" title="Toggle Ambient Audio">Sound Off</button>
        <button class="wb-btn" id="btn-theme-toggle-3d" type="button" title="Switch Daylight / Nocturne theme">
          <span id="label-theme-3d">Daylight</span>
        </button>
      </div>
    </header>

    <!-- Docked Chapter Tabs Sub-Toolbar (28px) -->
    <nav class="grimoire-tabs-bar" id="grimoire-tabs-bar" aria-label="Grimoire Chapters">
      <button class="tome-tab-3d active" id="tab-3d-inscribe" data-index="0" type="button">
        Inscription
      </button>
      <div class="saved-tabs-container" id="saved-tabs-container">
        <!-- Dynamic Legendary tabs added here -->
      </div>
    </nav>

    <!-- Central 1fr WebGL Canvas Viewport -->
    <main class="wb3d-viewport">
      <div id="webgl-container"></div>
    </main>

    <!-- Docked Query & Quick Preset Bar -->
    <section class="floating-inscribe-panel" id="inscribe-panel" aria-label="Query Input">
      <div class="inscribe-panel-row">
        <form class="inscribe-input-row" id="form-inscribe-3d">
          <label class="inscribe-header-title" for="input-query-3d">Query:</label>
          <input type="text" id="input-query-3d" class="inscribe-text-input" placeholder="Search legendary or ask query… e.g. 'How do I craft Twilight?'" autocomplete="off">
          <button type="submit" class="btn-inscribe-forge" id="btn-forge-3d">
            <span id="forge-btn-text">Query Archives</span>
            <span id="forge-spinner" class="spinner-3d hidden"></span>
          </button>
        </form>
        <span class="inscribe-account-badge tabular-nums" id="account-essence-badge">Syncing…</span>
      </div>

      <div class="quick-spells-chips">
        <button type="button" class="spell-chip" data-q="Which 2 legendaries can I quickly craft?">Fastest 2 Legendaries</button>
        <button type="button" class="spell-chip" data-q="How do I craft Twilight?">Craft Twilight</button>
        <button type="button" class="spell-chip" data-q="How do I craft Sunrise?">Craft Sunrise</button>
        <button type="button" class="spell-chip" data-q="How do I craft Eternity?">Forge Eternity</button>
        <button type="button" class="spell-chip" data-q="How do I craft WvW Legendary Armor?">WvW Armor</button>
      </div>
    </section>

    <!-- Bottom Status & Spread Controller (23px) -->
    <footer class="hud-bottom-bar">
      <div class="hud-bottom-left">
        <button class="btn-turn-page prev" id="btn-prev-3d" type="button" title="Previous Spread (Left Arrow)">Prev</button>
        <span class="page-indicator-pill tabular-nums" id="page-indicator-3d">Chapter I · Inscription · Spread 1 of 1</span>
        <button class="btn-turn-page next" id="btn-next-3d" type="button" title="Next Spread (Right Arrow)">Next</button>
      </div>
      <div class="interaction-hint">
        <span>Drag: rotate · Scroll: zoom · Click page / Arrows: turn spread</span>
      </div>
    </footer>
  </div>

  <!-- Transient Notification Badge -->
  <div class="copy-badge hidden" id="copy-badge">Updated</div>

  <!-- Audio Elements -->
  <audio id="sfx-page-turn" preload="auto"><source src="/static/audio/page-turn.mp3" type="audio/mpeg"></audio>
  <audio id="sfx-forge-chime" preload="auto"><source src="/static/audio/forge-chime.mp3" type="audio/mpeg"></audio>
  <audio id="sfx-quill" preload="auto"><source src="/static/audio/quill-scratch.mp3" type="audio/mpeg"></audio>

  <!-- Three.js & Post-Processing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script src="/static/js/grimoire_3d.js"></script>
</body>
</html>
