<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Priory Grimoire — Guild Wars 2 Legendary Tome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700;800&family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="gw2-desk-env">

    <!-- Ambient Floating Arcane Particles -->
    <canvas id="particles"></canvas>

    <!-- Scholar's Alchemical Desk Ambient Glows -->
    <div class="candle-glow candle-left"></div>
    <div class="candle-glow candle-right"></div>

    <!-- Top Archival Masthead -->
    <header class="top-nav-controls priory-control-bar">
        <div class="priory-archives-header">
            <span class="priory-seal-insignia" aria-hidden="true">⚜</span>
            <span class="priory-header-title">Durmand Priory Archives <span class="priory-header-sep">•</span> The Legendary Grimoire</span>
            <div class="priory-essence-indicator" title="Live Arcane Resonance with GW2 Archives">
                <span class="essence-pulse-orb"></span>
                <span class="essence-status-text">Live Essence</span>
            </div>
        </div>
        <div class="top-controls-actions">
            <a href="/3d" class="btn-concept-lab" title="Explore the experimental WebGL 3D Concept Laboratory">
                <span class="concept-lab-glyph">🧪</span> 3D Concept Lab →
            </a>
            <button class="audio-toggle" id="audio-toggle" title="Toggle ambient sound" aria-label="Toggle ambient sound" aria-pressed="false">
                <span class="audio-icon">🔇</span>
                <span class="audio-label">Sound Off</span>
            </button>
        </div>
    </header>

    <!-- Arcane Aura behind the Tome -->
    <div class="book-aura" id="book-aura"></div>

    <!-- THE GW2 LEGENDARY GRIMOIRE -->
    <main class="book-stage" id="book-stage">
        
        <!-- Top Bookmark Ribbon Tabs -->
        <div class="tome-tabs" id="tome-tabs">
            <button class="tome-tab active" data-page-index="0" id="tab-inscribe" title="Chapter I: Inscription">
                <span class="tab-label">Inscription</span>
            </button>
            <button class="tome-tab" data-page-index="1" id="tab-planner" title="Chapter II: Daily Session Planner">
                <span class="tab-label">Session Planner</span>
            </button>
            <button class="tome-tab" data-page-index="2" id="tab-arbitrage" title="Chapter III: Buy vs Craft Arbitrage">
                <span class="tab-label">Buy vs Craft</span>
            </button>
            <button class="tome-tab" data-page-index="3" id="tab-prereqs" title="Chapter IV: Prerequisite Audit">
                <span class="tab-label">Prerequisite Audit</span>
            </button>
            <div class="saved-recipes-tabs" id="saved-recipes-tabs">
                <!-- Dynamic Recipe Tabs inserted here -->
            </div>
        </div>

        <!-- The 2D Grimoire Tome -->
        <div class="grimoire-tome" id="grimoire-tome">
            
            <!-- Bottom Hanging Crimson Silk Ribbon Bookmarks -->
            <div class="hanging-ribbon ribbon-1"></div>
            <div class="hanging-ribbon ribbon-2"></div>
            <div class="hanging-ribbon ribbon-3"></div>

            <!-- Cordovan Leather Casing & Filigree -->
            <div class="cover cover-left">
                <div class="leather-face">
                    <div class="leather-filigree"></div>
                    <!-- 4 Corner Clasps -->
                    <div class="corner-clasp top-left"></div>
                    <div class="corner-clasp top-right"></div>
                    <div class="corner-clasp bottom-left"></div>
                    <div class="corner-clasp bottom-right"></div>
                </div>
            </div>
            <div class="cover cover-right">
                <div class="leather-face">
                    <div class="leather-filigree"></div>
                    <!-- 4 Corner Clasps -->
                    <div class="corner-clasp top-left"></div>
                    <div class="corner-clasp top-right"></div>
                    <div class="corner-clasp bottom-left"></div>
                    <div class="corner-clasp bottom-right"></div>
                </div>
            </div>

            <!-- Page Stacks (Visible paper edge depth) -->
            <div class="stack-left"></div>
            <div class="stack-right"></div>

            <!-- Central Binding Spine with Leather Ribs & Priory Key Emblem -->
            <div class="spine-binding">
                <svg class="priory-key-emblem" width="24" height="50" viewBox="0 0 24 50" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="12" cy="10" rx="8" ry="6" fill="none" stroke="#c8963e" stroke-width="2" />
                    <line x1="12" y1="16" x2="12" y2="44" stroke="#c8963e" stroke-width="2" />
                    <path d="M 12 36 L 18 36 L 18 40 L 12 40 M 12 40 L 18 40 L 18 44 L 12 44" fill="none" stroke="#c8963e" stroke-width="2" />
                </svg>
                <div class="spine-crease"></div>
                <div class="spine-rib"></div>
                <div class="spine-rib"></div>
                <div class="spine-rib"></div>
                <div class="spine-rib"></div>
            </div>

            <!-- DYNAMIC TWO-PAGE SPREAD -->
            <div class="pages-spread" id="pages-spread">
                
                <!-- LEFT PAGE CONTAINER -->
                <div class="page-sheet page-left" id="page-left-content">
                    <div class="parchment-grain"></div>
                    <div class="ink-vignette"></div>
                    <div class="spine-shadow spine-shadow-left"></div>
                    <div class="coffee-stain"></div>
                    <div class="page-inner" id="left-page-body">
                        <!-- Injected dynamically based on active page -->
                    </div>
                </div>

                <!-- RIGHT PAGE CONTAINER -->
                <div class="page-sheet page-right" id="page-right-content">
                    <div class="parchment-grain"></div>
                    <div class="ink-vignette"></div>
                    <div class="spine-shadow spine-shadow-right"></div>
                    <div class="coffee-stain"></div>
                    <div class="page-inner" id="right-page-body">
                        <!-- Injected dynamically based on active page -->
                    </div>
                </div>

            </div>

            <!-- BOTTOM PAGE NAVIGATION BAR -->
            <div class="tome-nav-footer">
                <button class="btn-page-nav" id="btn-prev-page" title="Previous Page">
                    <span class="nav-arrow">⮜</span> Previous Page
                </button>
                <div class="page-counter-badge" id="page-counter-display">
                    Chapter I • Page 1 of 1
                </div>
                <div class="tome-nav-actions-right">
                    <button class="btn-page-nav" id="btn-next-page" title="Next Page">
                        Next Page <span class="nav-arrow">⮞</span>
                    </button>
                </div>
            </div>
            
            <div class="kb-hint">Use ← → arrow keys to turn pages</div>

        </div>
    </main>

    <!-- Hidden audio elements -->
    <audio id="sfx-page-turn" preload="auto"><source src="/static/audio/page-turn.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-forge-chime" preload="auto"><source src="/static/audio/forge-chime.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-quill" preload="auto"><source src="/static/audio/quill-scratch.mp3" type="audio/mpeg"></audio>

    <script src="/static/js/app.js"></script>

    <div class="gw2-tooltip hidden" id="gw2-tooltip"></div>
</body>
</html>
